name: PR Sentry

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Run PR Sentry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Run PR Sentry Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
